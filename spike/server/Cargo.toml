[package]
name = "spike-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
spike-mmd = { version = "0.1.0", path = "../mmd" }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
yrs = { version = "0.28.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
