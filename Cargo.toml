[workspace]
members = ["crates/*"]
# Le prototype jetable de la phase 0 a son propre workspace.
exclude = ["spike"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.104"
# Sans fonctions par défaut : chaque crate choisit les siennes.
axum = { version = "0.8.9", default-features = false }
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.34"
mementum-crdt = { path = "crates/mementum-crdt" }
mementum-md = { path = "crates/mementum-md" }
mementum-schema = { path = "crates/mementum-schema" }
mementum-server = { path = "crates/mementum-server" }
mementum-store = { path = "crates/mementum-store" }
mementum-sync = { path = "crates/mementum-sync" }
proptest = "1.12"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# Sans fonctions par défaut (pas de TLS). `migrate` et `macros` pour `sqlx::migrate!`.
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
# Mémoire d'un processus (test de budget de `mementum-cli`).
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Même version que celle d'axum 0.8 (une seule version de tungstenite dans l'arbre).
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
# Types de l'API générés en TypeScript (`packages/protocol`). `no-serde-warnings` : ts-rs signale
# chaque attribut serde qu'il ne lit pas, dont `deserialize_with` (absent ou `null` dans `PATCH`),
# sans effet sur le type TypeScript.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "1.29", features = ["v7"] }
# `sync` : `Awareness` et les observateurs doivent pouvoir passer d'une tâche tokio à l'autre.
# Version épinglée : `crates/mementum-crdt/src/guard.rs` relit le format des mises à jour de
# yrs 0.28.1 (`Update::decode`, `ItemContent::decode`) et sa façon d'intégrer (trous, attente) ;
# toute montée de version doit le revérifier, test différentiel compris.
yrs = { version = "=0.28.1", features = ["sync"] }
