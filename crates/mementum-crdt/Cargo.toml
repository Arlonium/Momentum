[package]
name = "mementum-crdt"
description = "Document de page de Mementum : Yjs au format BlockNote, éditions, dédoublonnage et révision"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
mementum-md.workspace = true
mementum-schema.workspace = true
# JSON du sous-arbre d'un nœud étranger (prop `data` d'un bloc `unknown`).
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
yrs.workspace = true

[features]
# Pour les tests seulement : relever ce qu'une page donne à yrs (`hooks`, Ruling R875).
test-hooks = []

[dev-dependencies]
# Les essais comparent le yrs du serveur à celui de crates.io sur ce que les pages lui donnent.
mementum-crdt = { path = ".", features = ["test-hooks"] }
# Le yrs d'origine, tel que crates.io le publie : le témoin du yrs corrigé de `vendor/yrs`
# (`tests/squash_equivalence.rs`, Ruling R875). Jamais dans le serveur.
yrs-upstream = { package = "yrs", version = "=0.28.1", features = ["sync", "weak"] }
# Le proptest d'aller-retour utilise le générateur de la feature `arbitrary`.
mementum-md = { workspace = true, features = ["arbitrary"] }
proptest.workspace = true
