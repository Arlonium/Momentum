[package]
name = "mementum-md"
description = "Format MMD (Mementum Markdown) : conversion sans perte entre texte et arbre de blocs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Expose `arb::tree()`, le générateur proptest d'arbres de blocs (tests des autres crates).
arbitrary = ["dep:proptest", "dep:base64", "dep:serde_json"]

[dependencies]
mementum-schema.workspace = true
pulldown-cmark.workspace = true
base64 = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# Les tests d'intégration utilisent le générateur de la feature `arbitrary`.
mementum-md = { path = ".", features = ["arbitrary"] }
proptest.workspace = true
