[package]
name = "mementum-cli"
description = "Le binaire mementum : lance le serveur de Mementum"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mementum"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# `mementum reindex` (lot 4, Task S7) : l'index plein texte, vidé puis nourri par la commande.
mementum-search.workspace = true
mementum-server.workspace = true
# `mementum reindex` : la base, ouverte par `Store::open` (la règle des copies d'avant
# migration), ses tables de l'index, ses intentions et ses clôtures.
mementum-store.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
mementum-md.workspace = true
# Client Yjs de test (Ruling R6) : `killed.rs` le connecte au binaire lancé en sous-processus.
mementum-sync = { workspace = true, features = ["testkit"] }
serde_json.workspace = true
# Une base du lot 1, écrite par sa seule migration (copie d'avant migration, `cli.rs`).
sqlx.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
tokio.workspace = true
