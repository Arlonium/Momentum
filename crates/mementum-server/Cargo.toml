[package]
name = "mementum-server"
description = "Serveur HTTP de Mementum : API des pages, MMD et WebSocket de synchronisation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
# Mots de passe : Argon2id, hachage au format PHC.
argon2.workspace = true
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "ws"] }
# Jetons de session et d'invitation, écrits en base64url.
base64.workspace = true
# Cookie de session : lecture de l'en-tête `Cookie`, écriture de `Set-Cookie`.
cookie.workspace = true
# Octets aléatoires des jetons.
getrandom.workspace = true
# Les accès posés sur une page neuve (`Grant`), les rôles dans un espace.
mementum-acl.workspace = true
mementum-crdt.workspace = true
mementum-md.workspace = true
mementum-schema.workspace = true
mementum-store.workspace = true
# `ws::WsBytes` : la WebSocket d'axum vue comme le flux qu'attend `Hub::serve_connection`.
mementum-sync = { workspace = true, features = ["axum"] }
serde.workspace = true
# Messages en français pour un corps JSON refusé (erreurs de serde gardées par axum).
serde_json.workspace = true
serde_path_to_error.workspace = true
# SHA-256 des jetons : la base ne garde que leur hachage.
sha2.workspace = true
# `sync` : une inscription à la fois, et les calculs Argon2 chacun leur tour.
tokio = { workspace = true, features = ["net", "signal", "sync"] }
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[dev-dependencies]
# Client Yjs de test (Ruling R6) pour la route `/sync/{id}`.
mementum-sync = { workspace = true, features = ["testkit"] }
serde_json.workspace = true
# Pannes simulées dans la base (déclencheur SQLite), comme dans `mementum-sync`.
sqlx.workspace = true
tempfile.workspace = true
tokio.workspace = true
# Poignée de main WebSocket avec une en-tête `Origin` (Ruling R31).
tokio-tungstenite.workspace = true
tower = { workspace = true, features = ["util"] }
# Journaux lus par les tests.
tracing-subscriber.workspace = true
