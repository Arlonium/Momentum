[package]
name = "mementum-store"
description = "Stockage SQLite de Mementum : espaces, arbre de pages, accès, journal Yjs et instantanés"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `Grant`, `Level`, `Subject` : les accès posés sur les pages, dans leur forme texte.
mementum-acl.workspace = true
sqlx.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# `sync` : la barrière de départ des tests d'écritures simultanées.
tokio = { workspace = true, features = ["sync"] }
