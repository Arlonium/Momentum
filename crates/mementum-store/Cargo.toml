[package]
name = "mementum-store"
description = "Stockage SQLite de Mementum : espaces, arbre de pages, accès, journal Yjs et instantanés"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `Grant`, `Level`, `Subject` : les accès posés sur les pages, dans leur forme texte.
mementum-acl.workspace = true
sqlx.workspace = true
# `sync` : le canal qui annonce les espaces dont la version vient d'avancer (`Store::changes`), et
# le réveil d'une écriture dont le tour vient ; dans les tests, aussi la barrière de départ des
# écritures simultanées. `rt` : le compte auquel une tâche attribue ses écritures (`task_local!`).
tokio = { workspace = true, features = ["rt", "sync"] }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
