name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Les fichiers générés (types TypeScript, registre des blocs) sont commités à jour.
      - run: git diff --exit-code packages/protocol spec/schema

  # Budgets de performance du §5.10 côté serveur : tests marqués `#[ignore]`, qui n'ont de
  # sens qu'en release (chargement d'une page de 10 000 blocs depuis SQLite). Les budgets
  # du navigateur tournent dans le job `web`, après les autres tests e2e, sur un build de
  # production et un serveur `--release` (Ruling R38).
  #
  # Ce job lance tout ce qui est `#[ignore]` dans `mementum-sync` : la marque est réservée aux
  # mesures (Ruling R340). Une limite connue s'écrit en test exécuté, qui l'affirme
  # (`known_limit`), et tourne dans le job `rust`. Les mesures passent une à la fois, par un
  # verrou dans `tests/budgets.rs` (Ruling R341). `--nocapture` : leurs lignes `MESURE` sont au
  # journal de chaque passage, vert ou rouge.
  budgets:
    name: budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p mementum-sync -- --ignored --nocapture

  web:
    name: web
    runs-on: ubuntu-latest
    env:
      # Corepack télécharge la version de pnpm de `packageManager` sans rien demander.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Les tests e2e lancent le vrai serveur (`cargo run -p mementum-cli -- serve`, en
      # debug pour la suite ordinaire, en release pour les budgets).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm -C apps/web typecheck
      - run: corepack pnpm -C apps/web test
      - run: node tools/check-npm-licenses.mjs
      - run: corepack pnpm -C apps/web exec playwright install --with-deps chromium
      - run: corepack pnpm -C apps/web exec playwright test
      # Budgets du navigateur (§5.10) : `vite build` puis `vite preview`, serveur `--release`.
      - run: corepack pnpm -C apps/web exec playwright test -c playwright.budgets.config.ts

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
